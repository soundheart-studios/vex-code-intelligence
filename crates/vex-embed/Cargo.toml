[package]
name = "vex-embed"
description = "Natively hosted embeddings (bge-small through statically linked ONNX Runtime) and the deterministic hash backend."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
md-5 = "0.10"
sha2.workspace = true
serde_json.workspace = true
# Statically linked ONNX Runtime (pyke's prebuilt static libraries); no
# copied dylibs, no load-dynamic. `cargo xtask check-static-deps` holds it.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
serde_json.workspace = true
vex-store.workspace = true
