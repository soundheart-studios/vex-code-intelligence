[package]
name = "vex-app"
description = "One function per command. The only API: the CLI, daemon and MCP adapters call it and hold no logic."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
grep-matcher.workspace = true
grep-printer.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
indexmap = { workspace = true, features = ["serde"] }
rusqlite.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
termcolor.workspace = true
toml.workspace = true
tree-sitter = "=0.25.2"
vex-resolve.workspace = true
vex-core.workspace = true
serde.workspace = true
vex-embed.workspace = true
vex-extract.workspace = true
vex-store.workspace = true
vex-search.workspace = true

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }
vex-test-support.workspace = true
