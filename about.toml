# cargo-about config: `cargo about generate -m crates/vex-cli/Cargo.toml about.hbs -o THIRD_PARTY_LICENSES.md`
# Covers the crates compiled into the `vex` binary. Non-crate components
# (ONNX Runtime, vendored C sources) are listed by hand in about.hbs.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
ignore-transitive-dependencies = false

# Skip vex's own workspace crates (publish = false).
private = { ignore = true }
